name: Xcode - Build and Analyze

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build FlashMoE iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Find Xcode project
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print

      - name: Set Default Scheme
        working-directory: FlashMoE-iOS
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")

          default=$(echo "$scheme_list" | ruby -e '
            require "json"
            data = JSON.parse(STDIN.read)

            if data["project"]
              puts data["project"]["schemes"][0]
            elsif data["workspace"]
              puts data["workspace"]["schemes"][0]
            else
              exit 1
            end
          ')

          if [ -z "$default" ]; then
            echo "ERROR: Could not find an Xcode scheme."
            xcodebuild -list
            exit 1
          fi

          echo "$default" > default
          echo "Using scheme: $default"

      - name: Build
        working-directory: FlashMoE-iOS
        run: |
          scheme=$(cat default)

          if ls -A | grep -qi '\.xcworkspace$'; then
            filetype_parameter="workspace"
            file_to_build=$(ls -A | grep -i '\.xcworkspace$' | head -1)
          else
            filetype_parameter="project"
            file_to_build=$(ls -A | grep -i '\.xcodeproj$' | head -1)
          fi

          echo "Building:"
          echo "  Scheme: $scheme"
          echo "  Type:   $filetype_parameter"
          echo "  File:   $file_to_build"

          xcodebuild \
            clean build analyze \
            -scheme "$scheme" \
            -"$filetype_parameter" "$file_to_build" \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty

          exit ${PIPESTATUS[0]}

      - name: Find built app
        run: |
          echo "Looking for built .app:"
          find "$GITHUB_WORKSPACE/build" -type d -name "*.app" -print

      - name: Package app
        run: |
          APP_PATH=$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "*.app" \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            find "$GITHUB_WORKSPACE/build" -type f | head -200
            exit 1
          fi

          echo "Found app:"
          echo "$APP_PATH"

          mkdir -p "$GITHUB_WORKSPACE/artifacts/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/artifacts/Payload/"

          cd "$GITHUB_WORKSPACE/artifacts"
          zip -r FlashMoE-iOS-unsigned.zip Payload

      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: FlashMoE-iOS-unsigned
          path: artifacts/FlashMoE-iOS-unsigned.zip
          if-no-files-found: error
